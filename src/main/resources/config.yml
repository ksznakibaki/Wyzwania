# Po zmianach użyj /wyzwanie reload. Szczegóły i przykłady: README.md.
reset:
  timezone: Europe/Warsaw
  time: '04:00'
storage:
  autosave-seconds: 30
# Pusta lista = wszystkie światy; inaczej np. [world, world_nether, world_the_end].
worlds: []
pvp:
  enabled: false
  kill-cooldown-seconds: 1800
  damage-cooldown-seconds: 30
movement:
  # Maksymalny zaliczany odcinek jednego zdarzenia, zabezpieczenie przed skokami pozycji.
  max-step: 12.0
chat:
  # Wyłącz, jeśli formatowaniem czatu zarządza inny plugin.
  enabled: true
announcements:
  # Ogłoszenie dla wszystkich online po ukończeniu każdego zadania.
  completion: true
tab:
  # Indywidualny postęp w stopce listy graczy (klawisz TAB).
  enabled: true
  refresh-seconds: 2
prefixes:
  nowicjusz: {points: 0, text: '<gray>[Nowicjusz]</gray>'}
  lowca: {points: 100, text: '<green>[Łowca]</green>'}
  weteran: {points: 500, text: '<aqua>[Weteran]</aqua>'}
  mistrz: {points: 1000, text: '<light_purple>[Mistrz]</light_purple>'}
  legenda: {points: 2500, text: '<gold>[Legenda]</gold>'}

# Jeden ważony pakiet przedmiotów + losowe XP z zakresu + stałe punkty.
# XP to punkty doświadczenia, nie poziomy. Równa waga = równa szansa.
# Zmiany points stosują się do aktywnych zadań po /wyzwanie reload lub restarcie.
# Wcześniej zdobyte punkty pozostają bez zmian; przedmioty i XP nie są losowane ponownie.
rewards:
  EASY:
    xp-min: 100
    xp-max: 150
    points: 10
    pool:
      iron:
        label: '12 sztabek żelaza'
        weight: 3
        items: [{material: IRON_INGOT, amount: 12}]
      supplies:
        label: '16 steków i 64 strzały'
        weight: 3
        items: [{material: COOKED_BEEF, amount: 16}, {material: ARROW, amount: 64}]
      emeralds:
        label: '4 emeraldy'
        weight: 2
        items: [{material: EMERALD, amount: 4}]
  MEDIUM:
    xp-min: 150
    xp-max: 250
    points: 10
    pool:
      emeralds:
        label: '8 emeraldów'
        weight: 3
        items: [{material: EMERALD, amount: 8}]
      adventurer:
        label: 'Name tag i siodło'
        weight: 2
        items: [{material: NAME_TAG, amount: 1}, {material: SADDLE, amount: 1}]
      potion:
        label: '16 sztabek żelaza i mikstura odporności na ogień'
        weight: 2
        items: [{material: IRON_INGOT, amount: 16}, {material: POTION, amount: 1, potion: LONG_FIRE_RESISTANCE}]
  HARD:
    xp-min: 250
    xp-max: 400
    points: 10
    pool:
      diamond1:
        label: '1 diament i złote jabłko'
        weight: 4
        items: [{material: DIAMOND, amount: 1}, {material: GOLDEN_APPLE, amount: 1}]
      diamond3:
        label: '3 diamenty'
        weight: 2
        items: [{material: DIAMOND, amount: 3}]
      book:
        label: 'Książka Niezniszczalność III'
        weight: 2
        items: [{material: ENCHANTED_BOOK, amount: 1, enchantment: 'minecraft:unbreaking', level: 3}]
  WEEKLY:
    xp-min: 500
    xp-max: 1000
    points: 50
    pool:
      star:
        label: 'Gwiazda Netheru'
        weight: 1
        items: [{material: NETHER_STAR, amount: 1}]
      apple:
        label: 'Zaklęte złote jabłko'
        weight: 3
        items: [{material: ENCHANTED_GOLDEN_APPLE, amount: 1}]
      scrap1:
        label: '1 odłamek netherytu'
        weight: 4
        items: [{material: NETHERITE_SCRAP, amount: 1}]
      scrap2:
        label: '2 odłamki netherytu'
        weight: 2
        items: [{material: NETHERITE_SCRAP, amount: 2}]
      mending:
        label: 'Książka Naprawa'
        weight: 3
        items: [{material: ENCHANTED_BOOK, amount: 1, enchantment: 'minecraft:mending', level: 1}]

